<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Журнал тренировок</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Oswald:wght@500;600&display=swap">
<style>
/* Layout: one narrow phone-first column — date bar, entry form, today's sets, then past days. */
:root {
  --bg: #eceff3;
  --surface: #ffffff;
  --field: #f4f6f9;
  --ink: #141c26;
  --muted: #5c6878;
  --line: #d5dbe3;
  --accent: #1c4fd6;
  --accent-ink: #ffffff;
  --accent-soft: #e3eaff;
  --danger: #c2332b;
  --display: "Oswald", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141a; --surface: #1a2029; --field: #131820; --ink: #e9edf3; --muted: #97a3b4;
    --line: #2c3542; --accent: #7ea2ff; --accent-ink: #0c1322; --accent-soft: #1f2b47; --danger: #ff8278;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141a; --surface: #1a2029; --field: #131820; --ink: #e9edf3; --muted: #97a3b4;
  --line: #2c3542; --accent: #7ea2ff; --accent-ink: #0c1322; --accent-soft: #1f2b47; --danger: #ff8278;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.45;
  font-variant-numeric: tabular-nums;
}
.app {
  max-width: 560px; margin: 0 auto;
  padding-inline: 16px; padding-block: 20px 96px;
  display: flex; flex-direction: column; gap: 20px;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header */
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 {
  margin: 0; font-family: var(--display); font-weight: 600; font-size: 26px;
  letter-spacing: .02em; text-transform: uppercase; line-height: 1.1;
}
.status { font-size: 13px; color: var(--muted); }
.status.warn { color: var(--danger); }

/* Date bar */
.datebar { display: flex; align-items: center; gap: 8px; }
.datebar .when { flex: 1; min-width: 0; text-align: center; }
.when .day { font-family: var(--display); font-weight: 500; font-size: 20px; letter-spacing: .01em; }
.when .sub { font-size: 13px; color: var(--muted); }
.nav {
  width: 44px; height: 44px; flex: none; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); font-size: 20px; line-height: 1;
}
.nav:disabled { opacity: .35; cursor: default; }
.linkbtn {
  border: 0; background: none; padding: 2px 0; color: var(--accent);
  font-size: 13px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px;
}

/* Entry form */
.entry {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 16px; display: flex; flex-direction: column; gap: 14px;
}
label, .lbl { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
.text {
  width: 100%; height: 48px; padding: 0 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--field);
}
.text.bad { border-color: var(--danger); }
.err { font-size: 13px; color: var(--danger); margin-top: 6px; }
.hint { font-size: 13px; color: var(--muted); margin-top: 6px; }
.hint b { color: var(--ink); font-weight: 500; }
.quick { display: flex; flex-wrap: wrap; gap: 8px; }
.quick button {
  border: 1px solid var(--line); background: var(--field); border-radius: 999px;
  padding: 6px 12px; font-size: 14px;
}
.quick button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.nums { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.nums > div { min-width: 0; }
.stepper {
  display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; align-items: stretch;
  height: 52px; border: 1px solid var(--line); border-radius: 12px; background: var(--field); overflow: hidden;
}
.stepper button { border: 0; background: none; font-size: 22px; line-height: 1; color: var(--muted); }
.stepper button:active { background: var(--accent-soft); color: var(--accent); }
.stepper input {
  width: 100%; min-width: 0; border: 0; background: none; text-align: center;
  font-family: var(--display); font-weight: 500; font-size: 24px; padding: 0;
}
.stepper input:focus { outline: none; }
.stepper:focus-within { border-color: var(--accent); }
.stepper.bad { border-color: var(--danger); }
.primary {
  height: 52px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink);
  font-weight: 600; font-size: 16px;
}
.primary:active { filter: brightness(.92); }

/* Sections */
.sechead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
h2 {
  margin: 0; font-family: var(--display); font-weight: 500; font-size: 15px;
  letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.totals { font-size: 13px; color: var(--muted); }
.totals b { color: var(--ink); font-weight: 600; }
.list { display: flex; flex-direction: column; gap: 10px; }
.empty {
  border: 1px dashed var(--line); border-radius: 16px; padding: 22px 16px;
  text-align: center; color: var(--muted); font-size: 15px;
}

/* Exercise in the day */
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.ex .name { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
.ex .meta { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.sets { display: flex; flex-wrap: wrap; gap: 8px; }
.set {
  display: inline-flex; align-items: center; gap: 8px; height: 40px; padding-left: 10px;
  border-radius: 10px; background: var(--field); border: 1px solid var(--line);
}
.set.new { animation: pop .35s ease-out; }
@keyframes pop { from { background: var(--accent-soft); transform: scale(.94); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .set.new { animation: none; } }
.set .n { font-size: 12px; color: var(--muted); min-width: 1ch; }
.set .v { font-family: var(--display); font-weight: 500; font-size: 18px; white-space: nowrap; }
.set .v small { font-family: var(--body); font-size: 12px; font-weight: 400; color: var(--muted); }
.set .del {
  width: 36px; height: 38px; border: 0; background: none; color: var(--muted);
  font-size: 18px; line-height: 1; border-radius: 0 9px 9px 0;
}
.set .del:hover { color: var(--danger); }
.again {
  height: 40px; padding: 0 12px; border-radius: 10px; border: 1px dashed var(--accent);
  background: none; color: var(--accent); font-size: 14px; font-weight: 500;
}

/* History */
.past {
  display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; padding: 12px 14px;
}
.past .d { font-family: var(--display); font-weight: 500; font-size: 16px; }
.past .d small { display: block; font-family: var(--body); font-weight: 400; font-size: 12px; color: var(--muted); }
.past .what { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.past .cnt { font-size: 13px; color: var(--muted); white-space: nowrap; }
.more { align-self: center; }

/* Tabs */
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.tabs button {
  flex: 1 1 auto; height: 40px; border: 0; background: none; border-radius: 10px;
  font-size: 14px; font-weight: 500; color: var(--muted); white-space: nowrap; padding: 0 8px;
}
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.panel { display: flex; flex-direction: column; gap: 20px; }

/* My workout (plan) */
.planbox { display: flex; flex-direction: column; gap: 14px; }
.planhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.planname { font-family: var(--display); font-weight: 500; font-size: 22px; min-width: 0; overflow-wrap: anywhere; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.exhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.exhead .name { min-width: 0; }
.badge { font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.ex.done { border-color: var(--accent); }
.ex.done .badge { color: var(--accent); }
.set.plain { padding-right: 10px; }
.ex .lbl { margin: 12px 0 6px; }
.nextrow { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.unit { font-size: 13px; color: var(--muted); white-space: nowrap; }
.mini {
  height: 44px; width: 100%; min-width: 0; padding: 0 4px; text-align: center;
  border: 1px solid var(--line); border-radius: 10px; background: var(--field);
  font-family: var(--display); font-weight: 500; font-size: 20px;
}
.mini.bad { border-color: var(--danger); }
.dobtn {
  height: 44px; padding: 0 14px; border: 1px solid var(--accent); border-radius: 10px;
  background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 15px; white-space: nowrap;
}
.dobtn.sec { background: none; border-style: dashed; color: var(--accent); }
.ghost {
  height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 500; font-size: 15px;
}
.ghost.danger { color: var(--danger); }
.edrow { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--field); display: flex; flex-direction: column; gap: 10px; }
.edtop { display: flex; gap: 8px; }
.edtop .text, .ed3 .mini { background: var(--surface); }
.xbtn { width: 48px; height: 48px; flex: none; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 20px; line-height: 1; color: var(--muted); }
.ed3 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
select.mini { font-family: var(--body); font-size: 15px; font-weight: 500; text-align: left; padding: 0 8px; color: var(--ink); }
.edrow > .text { background: var(--surface); }
.edrow > .lbl { margin: 0; color: var(--ink); font-size: 15px; font-weight: 600; }
.srows { margin-top: 10px; }
.srow {
  display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: center;
  min-height: 56px; padding: 6px 0; border-top: 1px solid var(--line);
}
.srow .num { font-size: 13px; color: var(--muted); text-align: center; }
.srow .val { font-family: var(--display); font-weight: 500; font-size: 19px; }
.srow.todo .val { color: var(--muted); font-weight: 400; }
.srow .pair { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; }
.chk {
  width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: none;
  display: inline-flex; align-items: center; justify-content: center; font-size: 20px; line-height: 1;
  color: transparent; padding: 0; justify-self: end;
}
.srow.next .chk { border-color: var(--accent); }
.chk:not(.on):active { background: var(--accent-soft); }
.chk.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ex > .again { margin-top: 8px; }
.ed3 label { font-size: 12px; margin-bottom: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.actions .primary { padding: 0 20px; height: 48px; }
.actions .ghost { height: 48px; }

.delrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 12px; font-size: 14px; }
.list > .delrow { margin-top: 2px; justify-content: center; }
.delrow .ghost { height: 40px; }
.linkbtn.danger { color: var(--danger); }

/* Plan: today's weight stepper and progress history */
.wrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.wrow .lbl { margin: 0; }
.wstep {
  display: inline-grid; grid-template-columns: 44px auto 44px; align-items: center; height: 44px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--field); overflow: hidden;
}
.wstep button { border: 0; background: none; height: 100%; font-size: 22px; line-height: 1; color: var(--accent); }
.wstep button:active { background: var(--accent-soft); }
.wstep span { min-width: 88px; padding: 0 6px; text-align: center; font-family: var(--display); font-weight: 500; font-size: 19px; }
.ex .hint { margin-top: 6px; }
.hist { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.chart { display: block; width: 100%; height: auto; touch-action: pan-y; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 10px; font-family: var(--body); }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .pt { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .cross { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.readout { font-size: 13px; color: var(--muted); }
.readout b { color: var(--ink); font-weight: 600; }
.hrow { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; font-size: 14px; padding: 4px 0; }
.hrow .d { color: var(--muted); }

/* Plan weekdays */
.plantitle { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; min-width: 0; }
.dow { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.dow span {
  font-family: var(--display); font-weight: 500; font-size: 13px; letter-spacing: .08em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); line-height: 1.3;
}
.dow span.now { background: var(--accent); color: var(--accent-ink); }
.quick button small { font-size: 12px; color: var(--muted); margin-left: 6px; }
.quick button[aria-pressed="true"] small { color: inherit; }
.daypick { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.daypick button {
  height: 44px; padding: 0; border-radius: 10px; border: 1px solid var(--line); background: var(--field);
  font-size: 14px; font-weight: 500;
}
.daypick button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* Rest timer setting */
.rest { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.rest .sw { display: inline-flex; align-items: center; gap: 10px; margin: 0; font-size: 15px; color: var(--ink); cursor: pointer; }
.rest input[type="checkbox"] { width: 22px; height: 22px; margin: 0; accent-color: var(--accent); }

/* Calendar */
.calnav { display: flex; align-items: center; gap: 6px; }
.calnav span { min-width: 9.5em; text-align: center; font-weight: 500; font-size: 15px; }
.calnav button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 18px; line-height: 1; }
.calnav button:disabled { opacity: .35; cursor: default; }
.cal {
  display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px;
}
.cal .wd { text-align: center; font-size: 12px; color: var(--muted); padding-bottom: 4px; }
.cal button {
  aspect-ratio: 1; max-height: 52px; width: 100%; border-radius: 10px; border: 1px solid transparent;
  background: none; font-size: 15px; padding: 0;
}
.cal button.has { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.cal button.today { border-color: var(--line); }
.cal button.sel { border-color: var(--accent); border-width: 2px; }
.cal button:disabled { color: var(--muted); opacity: .45; cursor: default; }
.calnote { font-size: 13px; color: var(--muted); margin-top: 8px; }

/* Running rest timer */
.timer {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg);
}
.timer.done { background: var(--accent); color: var(--accent-ink); }
.timer .tfill { position: absolute; left: 0; top: 0; height: 4px; background: var(--accent); width: 100%; }
.timer.done .tfill { display: none; }
.timer .tlabel { flex: 1; min-width: 0; font-size: 14px; }
.timer .ttime { font-family: var(--display); font-weight: 600; font-size: 30px; line-height: 1; }
.timer button {
  height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid currentColor;
  background: none; color: inherit; font-size: 14px; font-weight: 500; white-space: nowrap;
}
body.timing .toast { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
body.timing .app { padding-bottom: 160px; }

/* Undo toast */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 6;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 14px; max-width: calc(100% - 32px);
  background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 14px; font-size: 14px;
}
.toast button { border: 0; background: none; color: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; padding: 4px 0; }

/* Header with settings button */
.top { flex-wrap: nowrap; align-items: flex-start; }
.top .ttl { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.gear {
  width: 44px; height: 44px; flex: none; padding: 0; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  display: inline-flex; align-items: center; justify-content: center;
}
.gear svg { width: 22px; height: 22px; display: block; }
.gear[aria-expanded="true"] { color: var(--accent); border-color: var(--accent); }
.tabs.off button[aria-selected] { background: none; color: var(--muted); }

/* Settings */
.sethead { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.setcard {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 16px; display: flex; flex-direction: column; gap: 12px;
}
.setcard h3 {
  margin: 0; font-family: var(--display); font-weight: 500; font-size: 15px;
  letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.setcard .sw { align-items: flex-start; line-height: 1.35; }
.setcard .sw { font-size: 15px; gap: 12px; }
.setcard .sw input[type="checkbox"] { flex: none; width: 22px; height: 22px; margin: 0; accent-color: var(--accent); }
.note { font-size: 14px; color: var(--muted); }
.okmsg { font-size: 14px; color: var(--accent); }
.backup-text {
  width: 100%; min-height: 120px; resize: vertical; padding: 10px 12px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--field); color: var(--ink);
  font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.setcard .actions .primary { height: 48px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Calendar: selected day */
.calday {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;
}
.calday .cd-title { font-family: var(--display); font-weight: 500; font-size: 18px; }
.calday .cd-title small { font-family: var(--body); font-weight: 400; font-size: 13px; color: var(--muted); margin-left: 8px; }
.calday .cd-plan { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.calday .hrow { grid-template-columns: minmax(0, 40%) minmax(0, 1fr); }
.calday .hrow .d { color: var(--ink); font-weight: 500; overflow-wrap: anywhere; }
.past.sel { border-color: var(--accent); }

/* Tabs stay inside the screen at large interface sizes */
.tabs button { flex: 1 1 0; min-width: 0; white-space: normal; line-height: 1.15; height: auto; min-height: 40px; padding: 6px 4px; font-size: 13.5px; hyphens: auto; }
.setcard .sw span { min-width: 0; }

/* Exercise type picker */
.typepick { display: flex; flex-wrap: wrap; gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 12px; background: var(--field); }
.typepick button {
  flex: 1 1 auto; min-width: 0; height: 36px; padding: 0 8px; border: 0; border-radius: 9px; background: none;
  font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap;
}
.typepick button[aria-checked="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.edrow .typepick { background: var(--surface); }
.edrow .typepick button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.chk.play { border-color: var(--accent); color: var(--accent); font-size: 15px; }

      </svg>
    </button>
  </header>

  <nav class="tabs" id="tabs" role="tablist" data-ia="nav.tabs" aria-label="Разделы">
    <button type="button" role="tab" data-tab="log" id="tabbtn-log" data-i="tab.log">Журнал</button>
    <button type="button" role="tab" data-tab="plan" id="tabbtn-plan" data-i="tab.plan">Моя тренировка</button>
    <button type="button" role="tab" data-tab="cal" id="tabbtn-cal" data-i="tab.cal">Календарь</button>
  </nav>

  <div class="datebar" id="datebar">
    <button class="nav" id="prev" type="button" data-ia="date.prev" aria-label="Предыдущий день">‹</button>
    <div class="when">
      <div class="day" id="dayTitle"></div>
      <div class="sub" id="daySub"></div>
    </div>
    <button class="nav" id="next" type="button" data-ia="date.next" aria-label="Следующий день">›</button>
  </div>

  <div class="panel" id="tab-log">
  <form class="entry" id="form" novalidate autocomplete="off">
    <div>
      <label for="exName" data-i="log.exercise">Упражнение</label>
      <input class="text" id="exName" type="text" data-ip="log.exPh" placeholder="Например, жим лёжа" maxlength="60" enterkeyhint="next">
      <div class="err" id="nameErr" hidden data-i="log.nameErr">Введите название упражнения.</div>
      <div class="hint" id="lastHint" hidden></div>
    </div>
    <div class="quick" id="quick" data-ia="log.quickAria" aria-label="Быстрый выбор упражнения"></div>
    <div class="typepick" id="typePick" role="radiogroup"></div>
    <div class="nums">
      <div id="fW">
        <label for="weight" id="wLabel">Вес, кг</label>
        <div class="stepper" id="wBox">
          <button type="button" data-step="weight" data-by="-2.5" data-ia="log.wMinus" aria-label="Минус 2,5 кг">−</button>
          <input id="weight" type="text" inputmode="decimal" value="20" aria-describedby="wNote">
          <button type="button" data-step="weight" data-by="2.5" data-ia="log.wPlus" aria-label="Плюс 2,5 кг">+</button>
        </div>
        <div class="hint" id="wNote"></div>
      </div>
      <div id="fR">
        <label for="reps" data-i="f.reps">Повторения</label>
        <div class="stepper" id="rBox">
          <button type="button" data-step="reps" data-by="-1" data-ia="log.rMinus" aria-label="Минус одно повторение">−</button>
          <input id="reps" type="text" inputmode="numeric" value="10">
          <button type="button" data-step="reps" data-by="1" data-ia="log.rPlus" aria-label="Плюс одно повторение">+</button>
        </div>
      </div>
      <div id="fT" hidden>
        <label for="dur" id="tLbl">Время подхода</label>
        <div class="stepper" id="tBox">
          <button type="button" data-step="dur" data-by="-15" data-ia="log.tMinus" aria-label="Меньше">−</button>
          <input id="dur" type="text" inputmode="numeric" value="1:00" aria-describedby="tNote">
          <button type="button" data-step="dur" data-by="15" data-ia="log.tPlus" aria-label="Больше">+</button>
        </div>
        <div class="hint" id="tNote" data-i="log.durNote">мин:сек</div>
      </div>
      <div id="fD" hidden>
        <label for="dist" data-i="f.dist">Дистанция, км</label>
        <div class="stepper" id="dBox">
          <button type="button" data-step="dist" data-by="-0.5" data-ia="log.dMinus" aria-label="Минус 0,5 км">−</button>
          <input id="dist" type="text" inputmode="decimal" value="" placeholder="0">
          <button type="button" data-step="dist" data-by="0.5" data-ia="log.dPlus" aria-label="Плюс 0,5 км">+</button>
        </div>
      </div>
    </div>
    <div class="rest">
      <label class="sw" for="restOn"><input type="checkbox" id="restOn"> <span data-i="log.restOn">Таймер отдыха после подхода</span></label>
      <div class="quick" id="restOpts" hidden data-ia="log.restAria" aria-label="Длительность отдыха"></div>
    </div>
    <button class="primary" type="submit" data-i="log.add">Добавить подход</button>
  </form>

  <section>
    <div class="sechead">
      <h2 id="dayHead"></h2>
      <div class="totals" id="totals"></div>
    </div>
    <div class="list" id="dayList"></div>
  </section>
  </div>

  <div class="panel" id="tab-plan" hidden>
    <div class="planbox" id="planView"></div>
  </div>

  <div class="panel" id="tab-cal" hidden>
  <section>
    <div class="sechead">
      <h2 data-i="tab.cal">Календарь</h2>
      <div class="calnav">
        <button type="button" id="calPrev" data-ia="cal.prev" aria-label="Предыдущий месяц">‹</button>
        <span id="calTitle"></span>
        <button type="button" id="calNext" data-ia="cal.next" aria-label="Следующий месяц">›</button>
      </div>
    </div>
    <div class="cal" id="cal"></div>
    <div class="calnote" id="calNote"></div>
  </section>

  <section id="histSec">
    <div class="sechead"><h2 data-i="hist.title">Прошлые тренировки</h2></div>
    <div class="list" id="histList"></div>
  </section>
  </div>

  <div class="panel" id="tab-set" hidden>
    <div class="planbox" id="setView"></div>
  </div>
</div>

<div class="timer" id="timer" hidden role="timer" aria-live="off">
  <div class="tfill" id="tFill"></div>
  <div class="tlabel" id="tLabel"></div>
  <div class="ttime" id="tTime"></div>
  <button type="button" id="tPlus" data-i="rest.plus">+30 с</button>
  <button type="button" id="tStop"></button>
</div>

<div class="toast" id="toast" hidden role="status">
  <span id="toastText"></span>
  <button type="button" id="undo" data-i="undo">Вернуть</button>
</div>

        return { label: t("ph.bestD"), aria: t("ph.mD"), val: function (x) { return x.dist; }, show: kmText, axis: num };
      }
      return { label: t("ph.bestDur"), aria: t("ph.mDur"), val: function (x) { return x.ttot; }, show: durText, axis: durText };
    }
    if (all.some(function (x) { return x.top > 0; })) {
      var kg = function (v) { return (type === "bw" && v > 0 ? "+" : "") + num(v) + " " + t("kg"); };
      return { label: type === "bw" ? t("ph.bestE") : t("ph.bestW"), aria: type === "bw" ? t("ph.mE") : t("ph.mW"),
        val: function (x) { return x.top; }, show: kg, axis: num };
    }
    return { label: t("ph.bestR"), aria: t("ph.mR"), val: function (x) { return x.reps; },
      show: function (v) { return num(v) + " " + t("ph.repsUnit"); }, axis: num };

      var X = function (k) { return L + k * (W - L - R) / (pts.length - 1); };
      var Y = function (v) { return T + (hi - v) * (H - T - B) / (hi - lo); };
      var root = svg("svg", { viewBox: "0 0 " + W + " " + H, "class": "chart", role: "img",

      var dots = pts.map(function (p, k) {

    return box;

  function parseBackup(text) {

    Object.keys(srcDays).forEach(function (k) { var d = cleanDay(k, srcDays[k]); if (d) outDays[k] = d; });

        importData(b);
        setMsg = { area: "import", kind: "ok", text: t("set.imported", backupCounts(b)) };
        renderSettings();
      }));
      a6.appendChild(btn("ghost", t("cancel"), function () { importPreview = null; setMsg = null; renderSettings(); }));
      c4.appendChild(a6);
    }
    var m4 = msgEl("import");
    if (m4) c4.appendChild(m4);
    box.appendChild(c4);
  }
  function previewImport(text) {
    var b = parseBackup(text);
    if (!b) { importPreview = null; setMsg = { area: "import", kind: "err", text: t("set.bad") }; }
    else { importPreview = b; setMsg = null; }
    renderSettings();
  }

  // ---------- render all ----------
  function renderData() {
    renderQuick(); renderHint(); renderDay(); renderPlan(); renderCalendarTab();
  }
  function renderAll() { renderForm(); renderDate(); renderData(); renderStatus(); }

  // ---------- actions ----------
  function go(date) {
    if (date > today()) return;
    cur = date;
    delAsk = null;
    itemEdit = null;
    drafts = {};
    calMonth = date.slice(0, 7);
    renderDate(); renderData();
  }
  // ---------- journal form: exercise type ----------
  var formType = "w";
  function compatible(a, b) { return a === b || ((a === "w" || a === "bw") && (b === "w" || b === "bw")); }
  // The type an exercise name was last used with: from your workouts first, then from the log.
  function typeOfName(name) {
    var found = null;
    plans.some(function (p) { return p.items.some(function (it) { if (same(it.name, name)) { found = typeOf(it); return true; } return false; }); });
    if (found) return found;
    var dates = Object.keys(days).sort().reverse();
    for (var i = 0; i < dates.length; i++) {
      var ex = days[dates[i]].exercises.filter(function (e) { return same(e.name, name); })[0];
      if (ex) return typeOf(ex);
    }
    return null;
  }
  function renderForm() {
    var box = $("typePick");
    box.textContent = "";
    box.setAttribute("aria-label", t("f.type"));
    TYPES.forEach(function (ty) {
      var b = btn(null, t("type." + ty), function () { setFormType(ty); });
      b.id = "ft-" + ty;
      b.setAttribute("role", "radio");
      b.setAttribute("aria-checked", ty === formType ? "true" : "false");
      box.appendChild(b);
    });
    var lifts = formType === "w" || formType === "bw";
    $("fW").hidden = !lifts; $("fR").hidden = !lifts;
    $("fT").hidden = lifts; $("fD").hidden = formType !== "cardio";
    $("wLabel").textContent = formType === "bw" ? t("f.extra") : t("f.w");
    $("wNote").textContent = formType === "bw" ? t("log.extraNote") : t("log.bw");
    $("tLbl").textContent = formType === "cardio" ? t("f.dur") : t("f.time");
  }
  function setFormType(ty) {
    if (ty === formType) return;
    var prev = formType;
    formType = ty;
    if (ty === "time") $("dur").value = "1:00";
    if (ty === "cardio") $("dur").value = "30:00";
    if (ty === "bw" && prev !== "bw") $("weight").value = "0";
    if (ty === "w" && !(parseNum($("weight").value) > 0)) $("weight").value = dec(20);
    clearErrors();
    renderForm();
  }
  function pick(name) {
    $("exName").value = name;
    clearErrors();
    var ty = typeOfName(name);
    if (ty) setFormType(ty);
    var cd = day(cur).exercises.filter(function (e) { return same(e.name, name); })[0];
    var src = cd && cd.sets.length ? cd.sets[cd.sets.length - 1] : null;
    if (!src) { var last = lastTime(name, cur); if (last) src = last.sets[0]; }
    if (src) {
      if (formType === "time" || formType === "cardio") {
        if (src.t) $("dur").value = durText(src.t);
        $("dist").value = src.d > 0 ? dec(src.d) : "";
      } else if (src.r) {
        $("weight").value = dec(src.w); $("reps").value = String(src.r);
      }
    }
    renderQuick(); renderHint();
  }
  function addSet(name, set, when, restSec, plan, type) {
    var date = when || cur;
    type = TYPES.indexOf(type) >= 0 ? type : "w";
    var d = days[date] || (days[date] = { date: date, exercises: [] });
    var ex = d.exercises.filter(function (e) { return same(e.name, name) && compatible(typeOf(e), type); })[0];
    if (!ex) { ex = { name: name, sets: [] }; d.exercises.push(ex); }
    if (type === "w") delete ex.type; else ex.type = type;
    ex.sets.push(set);
    if (plan) d.plan = { id: plan.id, name: plan.name };
    justAdded = { name: ex.name, index: ex.sets.length - 1 };
    haptic("tap");
    hideToast();
    touch(date);
    renderData();
    if (date === today() && type !== "cardio") startRest(restSec);
  }
  function removeSet(ei, si, when) {
    var date = when || cur;
    var d = days[date];
    if (!d || !d.exercises[ei]) return;
    var ex = d.exercises[ei], removed = ex.sets.splice(si, 1)[0];
    var exGone = !ex.sets.length;
    if (exGone) d.exercises.splice(ei, 1);
    undoState = { date: date, name: ex.name, type: typeOf(ex), ei: ei, si: si, set: removed, exGone: exGone, plan: d.plan || null };
    touch(date);
    renderData();
    showToast(t("toast.setDel", { s: setText(removed, typeOf(ex)) }));
  }
  function undo() {
    var u = undoState;
    if (!u) return;
    var d = days[u.date] || (days[u.date] = { date: u.date, exercises: [] });
    if (u.plan && !d.plan) d.plan = u.plan;
    var ex = d.exercises.filter(function (e) { return same(e.name, u.name) && compatible(typeOf(e), u.type); })[0];
    if (!ex) {
      ex = { name: u.name, sets: [] };
      if (u.type !== "w") ex.type = u.type;
      d.exercises.splice(Math.min(u.ei, d.exercises.length), 0, ex);
    }
    ex.sets.splice(Math.min(u.si, ex.sets.length), 0, u.set);
    hideToast();
    touch(u.date);
    renderData();
  }
  function showToast(text) {
    $("toastText").textContent = text;
    $("toast").hidden = false;
    clearTimeout(undoTimer);
    undoTimer = setTimeout(hideToast, 6000);
  }
  function hideToast() { clearTimeout(undoTimer); $("toast").hidden = true; undoState = null; }
  function clearErrors() {
    $("nameErr").hidden = true;
    $("exName").classList.remove("bad");
    $("wBox").classList.remove("bad");
    $("rBox").classList.remove("bad");
    $("tBox").classList.remove("bad");
    $("dBox").classList.remove("bad");
  }

  // ---------- events ----------
  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    clearErrors();
    var name = $("exName").value.trim().replace(/\s+/g, " ");
    if (!name) { $("nameErr").hidden = false; $("exName").classList.add("bad"); $("exName").focus(); return; }
    var set;
    if (formType === "time" || formType === "cardio") {
      var sec = parseDur($("dur").value, formType === "cardio" ? 60 : 1);
      if (!(sec >= 1) || sec > 86400) { $("tBox").classList.add("bad"); $("dur").focus(); return; }
      set = { t: sec };
      if (formType === "cardio") {
        var km = $("dist").value.trim() === "" ? 0 : parseNum($("dist").value);
        if (!(km >= 0) || km > 1000) { $("dBox").classList.add("bad"); $("dist").focus(); return; }
        set.d = Math.round(km * 100) / 100;
      }
    } else {
      var w = $("weight").value.trim() === "" ? 0 : parseNum($("weight").value);
      var r = Math.round(parseNum($("reps").value));
      if (!(w >= 0) || w > 1000) { $("wBox").classList.add("bad"); $("weight").focus(); return; }
      if (!(r >= 1) || r > 1000) { $("rBox").classList.add("bad"); $("reps").focus(); return; }
      set = { w: Math.round(w * 100) / 100, r: r };
    }
    addSet(name, set, cur, undefined, null, formType);
  });
  $("exName").addEventListener("input", function () {
    clearErrors();
    var ty = typeOfName($("exName").value);
    if (ty) setFormType(ty);
    renderQuick(); renderHint();
  });
  document.querySelectorAll("[data-step]").forEach(function (b) {
    b.addEventListener("click", function () {
      var input = $(b.getAttribute("data-step")), by = parseFloat(b.getAttribute("data-by"));
      if (input.id === "dur") {
        var unit = formType === "cardio" ? 60 : 1;
        var sec = parseDur(input.value, unit);
        if (!isFinite(sec)) sec = formType === "cardio" ? 1800 : 60;
        input.value = durText(Math.max(formType === "cardio" ? 60 : 5, sec + by * (formType === "cardio" ? 4 : 1)));
        clearErrors();
        return;
      }
      var v = parseNum(input.value);
      if (!isFinite(v)) v = 0;
      var min = input.id === "reps" ? 1 : 0;
      v = Math.max(min, Math.round((v + by) * 100) / 100);
      input.value = dec(v);
      clearErrors();
    });
  });
  ["weight", "reps"].forEach(function (id) {
    $(id).addEventListener("focus", function () { this.select(); });
    $(id).addEventListener("input", clearErrors);
  });
  $("prev").addEventListener("click", function () { go(shift(cur, -1)); });
  $("next").addEventListener("click", function () { go(shift(cur, 1)); });
  $("undo").addEventListener("click", undo);
  $("calPrev").addEventListener("click", function () { moveMonth(-1); });
  $("calNext").addEventListener("click", function () { moveMonth(1); });
  $("restOn").addEventListener("change", function () {
    rest.on = this.checked;
    lsSet("wl-rest", rest);
    renderRest();
    if (!rest.on) stopRest();
  });
  $("tPlus").addEventListener("click", function () {
    if (tMode === "work") { cancelWork(); return; }
    tEnd += 30000; tTotal += 30;
    scheduleBeep(Math.max(0, (tEnd - Date.now()) / 1000));
    tick();
  });
  $("tStop").addEventListener("click", function () {
    if (tMode === "work") finishWork((Date.now() - workStart) / 1000);
    else stopRest();
  });
  $("gear").addEventListener("click", openSettings);
  TABS.forEach(function (k) {
    $("tabbtn-" + k).addEventListener("click", function () { showTab(k); });
  });
  $("planView").addEventListener("focusout", function () {
    if (planStale) setTimeout(renderPlan, 0);
  });

  // ---------- boot ----------
  setLang(lang);
  applySize();
  $("weight").value = dec(20);
  renderRest();
  showTab(tab);
  renderAll();
  connect();
})();
</script>

</body>
</html>
